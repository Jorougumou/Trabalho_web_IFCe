<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área de Administração</title>
</head>
<body>
    <header>
        <h1>Área de Administração</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Voltar para a Página Inicial</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="objetos.html">Cadastro de Objetos</a></li>
                <li><a href="usuarios.html">Cadastro de Usuários</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Acesso ao Sistema</h2>
            <form action="objetos.html" method="post">
                <div>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="admin@exemplo.com">
                </div>
                <br>
                <div>
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <br>
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Desenvolvido por Seu Nome | <a href="../sobre.html">Sobre o autor</a></p>
    </footer>
</body>
</html>
